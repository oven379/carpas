upstream carpasss_back {
    server 127.0.0.1:8088;
    keepalive 16;
}

# Защита от массового копирования сайта: ограничение частоты запросов страниц и блокировка известных копировальщиков.
# Поисковые роботы (Яндекс, Google) и ИИ-поиск не блокируются.
limit_req_zone $binary_remote_addr zone=carpas_html:10m rate=10r/s;
limit_req_status 429;

map $http_user_agent $carpas_bad_bot {
    default 0;
    ~*(HTTrack|WebCopier|WebZIP|Teleport|SiteSnagger|Offline\ Explorer|Scrapy|python-requests|libwww-perl|MJ12bot|AhrefsBot|SemrushBot|DotBot|BLEXBot|Bytespider|PetalBot|CCBot|Diffbot|ImagesiftBot|omgili) 1;
}

# Адреса, которые обслуживает React Router (кабинеты, публичные страницы партнёров и т.д.).
# Всё, чего нет ни в dist/, ни в этом списке, получает настоящий HTTP 404 (а не 200 с главной — soft-404 для поисковиков).
map $uri $spa_route {
    default 0;
    ~^/(auth|garage|car|cars|create|requests|detailing|notifications|d|g|share|admin|market|for-detailing|about|pitch|policy|terms)(/|$) 1;
}

# www -> основной домен (один адрес сайта для поисковиков; canonical и sitemap указывают на carpasss.ru)
server {
    listen 443 ssl http2;
    server_name www.carpasss.ru;

    ssl_certificate /etc/letsencrypt/live/carpasss.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carpasss.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://carpasss.ru$request_uri;
}

# Фронт
server {
    listen 443 ssl http2 default_server;
    server_name carpasss.ru;

    root /var/www/carpas/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/carpasss.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carpasss.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP stapling — iOS не делает внешний запрос к Let's Encrypt при каждом handshake
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/carpasss.ru/chain.pem;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # HSTS — браузер запоминает что сайт только HTTPS; includeSubDomains покрывает back.carpasss.ru
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;

    # Единый вид адреса без завершающего слэша (/blog/ -> /blog): так совпадают canonical, sitemap и реальный URL.
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
        # HTML не кешируем (после деплоя хеши чанков меняются). add_header в location отключает наследование
        # HSTS с уровня server — поэтому HSTS повторяем здесь же.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        if ($carpas_bad_bot) { return 403; }
        limit_req zone=carpas_html burst=40 nodelay;
        # /blog -> dist/blog/index.html (пререндер) с кодом 200, без 301 на /blog/
        try_files $uri $uri/index.html @spa;
    }

    location @spa {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        if ($spa_route = 0) { return 404; }
        rewrite ^ /index.html break;
    }

    error_page 404 /404.html;
    location = /404.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
        internal;
    }

    # Vite-чанки с хешами в имени файла — можно кешировать навсегда
    location ~* ^/assets/.*\.(js|css|woff|woff2|ttf)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Статичные иконки и картинки из dist (не пользовательские медиа)
    location ~* ^/(favicon|logo|icon).*\.(png|svg|ico|webp|gif)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Прочие статичные файлы из dist
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff|woff2|ttf|gif)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # SPA-точка входа: no-cache чтобы после деплоя браузер не показывал старый HTML со старыми хешами чанков
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}

# Бэкенд API
server {
    listen 443 ssl http2;
    server_name back.carpasss.ru;

    ssl_certificate /etc/letsencrypt/live/carpasss.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carpasss.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/carpasss.ru/chain.pem;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://carpasss_back;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        client_max_body_size 32m;
    }
}

# HTTP → HTTPS редирект
server {
    listen 80;
    server_name www.carpasss.ru;
    return 301 https://carpasss.ru$request_uri;
}

server {
    listen 80;
    server_name carpasss.ru back.carpasss.ru;
    return 301 https://$host$request_uri;
}
